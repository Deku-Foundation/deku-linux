name: Bug report
description: Report a reproducible problem in project tooling or documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use this public form. Follow SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant OS, version, commit, and tools.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Include non-sensitive output only. Redact tokens and personal data.
    validations:
      required: false
