name: Package manifest prototype

on:
  push:
    branches: [main, dev]
    paths:
      - "prototype/package-manifest/**"
      - ".github/workflows/package-manifest-check.yml"
  pull_request:
    paths:
      - "prototype/package-manifest/**"
      - ".github/workflows/package-manifest-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate example manifest
        run: python prototype/package-manifest/validate.py prototype/package-manifest/examples/hello.json
      - name: Run unit tests
        run: python -m unittest discover -s prototype/package-manifest/tests -v
